<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Night</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#ececef;--mute:#9aa0aa;--acc:#e5b33a;--line:#ffffff1a}
@media (prefers-color-scheme:light){:root{--bg:#f4f4f6;--card:#fff;--fg:#16181d;--mute:#5d636e;--acc:#a8770a;--line:#0000001a}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font:15px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0 8px 0 0}
button,input,textarea{font:inherit;color:inherit}
button,a.btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none}
button.on{background:var(--acc);color:#000;border-color:var(--acc)}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
#q{flex:1;min-width:140px}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.chips{overflow-x:auto;flex-wrap:nowrap;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;font-size:13px}
.sep{color:var(--mute)}
main{max-width:1150px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.card{background:var(--card);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:opacity .3s}
.card img.poster,#tcard img.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--line)}
.card img.poster{aspect-ratio:3/4}
.card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1}
.mute{color:var(--mute);font-size:13px}
.match{color:var(--acc);font-weight:600}
.prov img{width:24px;height:24px;border-radius:6px;margin-right:4px}
.acts{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:auto}
.acts button{padding:5px 0;font-size:14px;border-radius:8px}
details{font-size:13px}
summary{cursor:pointer;color:var(--mute)}
.flash{outline:3px solid var(--acc)}
#settings{background:var(--card);border-radius:10px;padding:12px;margin-bottom:16px}
#settings>*+*{margin-top:10px}
#tonight{max-width:440px;margin:auto}
#tcard{background:var(--card);border-radius:14px;overflow:hidden;touch-action:pan-y;user-select:none;transition:transform .2s}
#tcard.drag{transition:none}
#tcard img.poster{max-height:45vh}
#tcard .info{padding:12px;gap:6px}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:0}
#tbtns{justify-content:center;padding:12px 0;position:sticky;bottom:0;background:var(--bg)}
@media (max-width:700px){header{position:static}}
#tbtns.big button{font-size:18px;padding:12px 22px}
#tbtns:not(.big) button{font-size:14px}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>🍿 Movie Night</h1>
    <select id="who" aria-label="Who is watching">
      <option value="Harry">👤 Harry</option><option value="Monica">👤 Monica</option><option value="both">👥 Together</option>
    </select>
    <button data-tab="tonight">🌙 Tonight</button>
    <button data-tab="foryou" class="on">For you</button>
    <button data-tab="watch">Watchlist</button>
    <button data-tab="seen">Seen &amp; hidden</button>
    <button id="regen">🔄 New picks</button>
    <button id="surprise">🎲 Surprise me</button>
    <button id="gear" aria-label="Settings">⚙︎</button>
  </div>
  <form id="search" class="row" style="margin-top:8px"><input id="q" type="search" placeholder="Search a title to rate or add…"></form>
  <div id="kinds" class="row" style="margin-top:8px"></div>
  <div id="filters" class="row" style="margin-top:8px"></div>
  <div id="genres" class="row chips"></div>
</header>
<main>
  <section id="settings" hidden>
    <div><b>TMDB key</b> <span class="mute">(free: themoviedb.org → Settings → API; v3 key or read-access token)</span>
      <form id="keyform" class="row"><input id="key" autocomplete="off"><button>Save</button></form></div>
    <div><b>OMDb key</b> <span class="mute">for 🍅 Rotten Tomatoes scores (free: omdbapi.com/apikey.aspx, 1,000 lookups/day)</span>
      <form id="omdbform" class="row"><input id="omdb" autocomplete="off"><button>Save</button></form></div>
    <div><b>Sync phone ↔ computer</b> <span class="mute">copy on one device, paste + Load on the other (both profiles)</span>
      <textarea id="sync" rows="3"></textarea>
      <div class="row"><button id="copy">Copy our taste</button><button id="load">Load</button></div></div>
  </section>
  <p id="status" class="mute"></p>
  <div id="grid" class="grid"></div>
  <section id="tonight" hidden>
    <p id="tlearn" class="mute"></p>
    <div id="tcard"></div>
    <div id="tbtns" class="row"></div>
  </section>
</main>
<script>
const API = 'https://api.themoviedb.org/3', IMG = 'https://image.tmdb.org/t/p/';
const SERVICES = {'Netflix': /netflix/i, 'Prime Video': /amazon prime/i, 'Apple TV': /apple tv/i, 'HBO Max': /hbo|^max$/i};
const KINDS = {movie: '🎬 Movies', tv: '📺 TV shows', doc: '🎥 Documentaries'};
// Moods: genre ids to include (any of) / exclude, optional max length in minutes; tv = the TV-genre version (TMDB uses different ids)
const MOODS = {
  '😂 Light & funny': {g: '35', not: '27|53|10752|18', tv: {g: '35', not: '18|80|10768'}},
  '🛋️ Easy, nothing heavy': {g: '35|10751|16|10749', not: '27|53|10752', run: 110, tv: {g: '35|10751|16', not: '80|10768', run: 35}},
  '💕 Romantic': {g: '10749'},
  '💥 Action-packed': {g: '28|12', not: '16|10751', tv: {g: '10759', not: '16|10762'}},
  '🕵️ Gripping': {g: '80|53|9648', not: '35|16', tv: {g: '80|9648', not: '35|16'}},
  '🧠 Mind-bending': {g: '878|9648', not: '16|10751', tv: {g: '10765|9648', not: '16|10762'}},
  '😱 Scary': {g: '27'},
  '😢 Moving': {g: '18', not: '35|27|28', tv: {g: '18', not: '35|80|10759'}},
  '🏛️ History & war': {g: '36|10752', tv: {g: '10768'}},
  '👨‍👩‍👧 Family': {g: '10751|16', not: '27', tv: {g: '10751|10762|16'}},
};
const HEAVY = [18, 27, 53, 80, 10752, 10768], LIGHT = [35, 10751, 16, 10749, 10762];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

// users.<name>: ratings: key -> item + {r: 2 favourite | 1 seen good | 0 seen ok | -1 seen bad, t}; watch / nope (not interested): key -> item + {t}
// key = TMDB id for movies, 't' + id for TV (ids overlap between the two)
const S = Object.assign({key: '', omdb: '', kind: 'movie', who: 'Harry', users: null, off: [], f: {minScore: 0, minRT: 0, maxRun: 0}},
  JSON.parse(localStorage.getItem('movienight') || '{}'));
const blank = () => ({ratings: {}, watch: {}, nope: {}});
if (!S.users) S.users = {Harry: {...blank(), ...{ratings: S.ratings || {}, watch: S.watch || {}, nope: S.nope || {}}}, Monica: blank()}; // pre-profile data was Harry's
delete S.ratings; delete S.watch; delete S.nope;
const save = () => localStorage.setItem('movienight', JSON.stringify(S));
// Together = both profiles: reads merge, every rating/list action is applied to both
const who = () => S.who === 'both' ? Object.keys(S.users) : [S.who];
const view = f => Object.assign({}, ...who().map(n => S.users[n][f]));

let genres = {movie: {}, tv: {}}, myProv = [], tab = 'foryou', pick = '', shown = new Map(), T = null;
let round = 0, lastCount = null, gen = 0; const past = new Set(); // "New picks": skip what you've already been shown
const info = {}; // key -> {list, link, runtime, seasons, imdb}, in-memory cache
const RT = JSON.parse(localStorage.getItem('movienight-rt') || '{}'); // key -> Rotten Tomatoes % (null = none), kept between visits

const norm = (x, mt) => ({...x, mt, title: x.title || x.name, release_date: x.release_date || x.first_air_date});
const key = m => (m.mt === 'tv' ? 't' : '') + m.id;
const kindOf = m => m.genre_ids?.includes(99) ? 'doc' : m.mt === 'tv' ? 'tv' : 'movie';
const types = () => S.kind === 'tv' ? ['tv'] : S.kind === 'doc' ? ['movie', 'tv'] : ['movie'];
const minVotes = mt => mt === 'movie' && S.kind === 'movie' ? 50 : 20; // series and docs get far fewer votes
const stored = m => norm(m, m.mt || 'movie');
const rated = m => who().some(n => S.users[n].ratings[key(m)] || S.users[n].nope[key(m)]);
const fmt = min => min >= 60 ? `${Math.floor(min / 60)}h ${String(min % 60).padStart(2, '0')}m` : `${min}m`;

async function tmdb(path, params = {}, tries = 0) {
  const u = new URL(API + path);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const bearer = S.key.length > 40;
  if (!bearer) u.searchParams.set('api_key', S.key);
  const r = await fetch(u, {headers: bearer ? {Authorization: 'Bearer ' + S.key} : {}});
  if (r.status === 429 && tries < 3) { await new Promise(ok => setTimeout(ok, 1000 * (tries + 1))); return tmdb(path, params, tries + 1) }
  if (!r.ok) throw new Error('TMDB ' + r.status);
  return r.json();
}

const serviceOf = name => Object.keys(SERVICES).find(k => SERVICES[k].test(name));
const activeIds = () => myProv.filter(p => !S.off.includes(serviceOf(p.provider_name))).map(p => p.provider_id);

async function getInfo(m) {
  const k = key(m);
  if (!info[k]) {
    try {
      const d = await tmdb(`/${m.mt}/${m.id}`, {append_to_response: 'watch/providers,external_ids'});
      const nl = d['watch/providers'].results.NL || {};
      const ours = myProv.map(p => p.provider_id);
      const list = [...nl.flatrate || [], ...nl.ads || []].filter(p => ours.includes(p.provider_id));
      // one logo per service (e.g. "HBO Max" and "HBO Max Amazon Channel" are the same)
      info[k] = {list: list.filter((p, i) => list.findIndex(q => serviceOf(q.provider_name) === serviceOf(p.provider_name)) === i),
        link: nl.link, runtime: d.runtime || d.episode_run_time?.[0], seasons: d.number_of_seasons, imdb: d.imdb_id || d.external_ids?.imdb_id};
    } catch { return {list: []} } // not cached: retried next time
  }
  return info[k];
}
async function getRT(m) {
  const k = key(m), imdb = info[k]?.imdb;
  if (k in RT || !S.omdb || !imdb) return RT[k];
  try {
    const d = await (await fetch(`https://www.omdbapi.com/?i=${imdb}&apikey=${encodeURIComponent(S.omdb)}`)).json();
    if (d.Response === 'False' && d.Error !== 'Incorrect IMDb ID.') return; // key/limit problem: don't cache, try again later
    RT[k] = parseInt(d.Ratings?.find(r => r.Source === 'Rotten Tomatoes')?.Value) || null;
    localStorage.setItem('movienight-rt', JSON.stringify(RT));
  } catch {}
  return RT[k];
}

// what's wanted right now: the type filter + a mood or a single genre from the chips row
function want() {
  if (S.kind === 'doc') return {g: '99'};
  const w = (pick.startsWith('g') ? {g: pick.slice(1)} : S.kind === 'tv' ? MOODS[pick]?.tv : MOODS[pick]) || {};
  return {...w, not: [w.not, S.kind === 'tv' ? '99|10767|10763' : '99'].filter(Boolean).join('|')}; // keep docs (and talk/news) out of movies/TV
}
const maxRun = () => Math.min(...[S.f.maxRun, want().run].filter(Boolean)); // Infinity = no limit
const fits = m => { const w = want(), has = x => m.genre_ids?.includes(+x);
  return types().includes(m.mt) && (!w.g || w.g.split('|').some(has)) && (!w.not || !w.not.split('|').some(has)) };
// series often have no episode length on TMDB: let those through rather than hide them
const runOK = (m, lim) => !isFinite(lim) || (info[key(m)]?.runtime ? info[key(m)].runtime <= lim : m.mt === 'tv');
const passes = m => fits(m) && (!S.f.minScore || m.vote_average >= S.f.minScore) && runOK(m, maxRun())
  && (!S.f.minRT || !S.omdb || RT[key(m)] >= S.f.minRT);
const onMyServices = m => info[key(m)]?.list.some(p => activeIds().includes(p.provider_id));

// --- Learning: taste profile built from everything the active profile(s) rated / saved ---
function profile() {
  const g = {}, l = {}, all = f => who().flatMap(n => Object.values(S.users[n][f])).map(stored), rs = all('ratings');
  const add = (m, w) => {
    for (const x of m.genre_ids || []) g[x] = (g[x] || 0) + w;
    l[m.original_language] = (l[m.original_language] || 0) + w;
  };
  rs.forEach(m => add(m, m.r));
  all('watch').forEach(m => add(m, 0.5));
  all('nope').forEach(m => add(m, -0.5)); // mild: not interested ≠ watched and disliked
  return {
    g, l, rec: new Map(), n: Math.sqrt(rs.length + 1), count: rs.length,
    liked: rs.filter(m => m.r > 0 && kindOf(m) === S.kind).sort((a, b) => b.r - a.r || b.t - a.t), // favourites first
    topGenres: Object.keys(g).filter(k => g[k] > 0).sort((a, b) => g[b] - g[a]),
  };
}
// ponytail: hand-tuned linear score (genre + language taste, "people who liked X also liked", quality).
// Swap for a trained model only if this stops feeling right after ~50 ratings.
function score(m, P) {
  const ids = m.genre_ids || [], gs = ids.length ? ids.reduce((a, x) => a + (P.g[x] || 0), 0) / ids.length : 0;
  return (gs + 0.5 * (P.l[m.original_language] || 0)) / P.n
    + 0.7 * Math.min(P.rec.get(key(m)) || 0, 3)
    + 0.5 * ((m.vote_average || 6.5) - 6.5);
}
const matchPct = s => Math.round(100 / (1 + Math.exp(-s)));

function discoverBase(mt, w, run, minScore) {
  const b = {watch_region: 'NL', with_watch_providers: activeIds().join('|'), with_watch_monetization_types: 'flatrate|ads', 'vote_count.gte': minVotes(mt)};
  if (w.g) b.with_genres = w.g;
  if (w.not) b.without_genres = w.not;
  if (minScore) b['vote_average.gte'] = minScore;
  if (isFinite(run)) b['with_runtime.lte'] = run;
  return b;
}
const discover = (mt, p) => tmdb(`/discover/${mt}`, p).then(r => r.results.map(x => norm(x, mt)));

async function forYou(fresh = false) {
  if (!activeIds().length) return render([], 'Turn on at least one service.');
  status('Finding picks for you…');
  const my = ++gen, P = profile(), w = want();
  if (fresh) { round++; shown.forEach((_, k) => past.add(k)) }
  const reqs = [];
  for (const mt of types()) {
    const base = discoverBase(mt, w, maxRun(), S.f.minScore);
    [1, 2, 3].forEach(p => reqs.push(discover(mt, {...base, sort_by: 'popularity.desc', page: p + 3 * round})));
    reqs.push(discover(mt, {...base, sort_by: 'vote_average.desc', 'vote_count.gte': minVotes(mt) * 20, page: 1 + round}));
    if (!w.g && P.topGenres.length) reqs.push(discover(mt, {...base, with_genres: P.topGenres.slice(0, 3).join('|'), sort_by: 'popularity.desc', page: 1 + round}));
  }
  for (const m of P.liked.slice(0, 6)) reqs.push(tmdb(`/${m.mt}/${m.id}/recommendations`).then(r => r.results.map(x => {
    const n = norm(x, m.mt); P.rec.set(key(n), (P.rec.get(key(n)) || 0) + m.r); return n;
  })));
  const seen = new Set(), cands = [];
  for (const r of await Promise.allSettled(reqs))
    if (r.status === 'fulfilled') for (const m of r.value)
      if (!seen.has(key(m)) && !past.has(key(m)) && !rated(m) && m.poster_path && m.vote_count >= minVotes(m.mt) && fits(m)) { seen.add(key(m)); cands.push(m) }
  cands.forEach(m => m.score = score(m, P));
  cands.sort((a, b) => b.score - a.score);
  // check availability in batches down the ranked list until 24 fit; "people also liked" picks are often not on your services
  const ok = [];
  for (let i = 0; i < Math.min(cands.length, 200) && ok.length < 24; i += 25) {
    const batch = cands.slice(i, i + 25);
    await Promise.all(batch.map(getInfo));
    const avail = batch.filter(onMyServices);
    if (S.f.minRT) await Promise.all(avail.map(getRT)); // ponytail: RT filter can cost up to ~200 OMDb lookups per fresh list (cached after)
    ok.push(...avail.filter(passes));
  }
  ok.splice(24);
  await Promise.all(ok.map(getRT));
  if (my !== gen) return; // a newer load started (filter changed mid-way)
  const delta = lastCount === null ? 0 : P.count - lastCount;
  lastCount = P.count;
  const when = new Date().toLocaleTimeString('nl-NL', {hour: '2-digit', minute: '2-digit'});
  render(ok.map(m => ({...m, match: P.count >= 3 ? matchPct(m.score) : null})),
    !ok.length ? 'Nothing matches these filters — loosen them a bit.'
      : P.count < 3 ? 'Rate a few titles you know (or search one) and this starts learning your taste.'
      : `✓ Updated ${when} · based on ${P.count} ratings` + (delta > 0 ? ` (${delta} new since last picks)` : '') + (round ? ` · set ${round + 1}` : ''));
}

async function listTab(obj, empty) {
  const my = ++gen, list = Object.values(obj).map(stored).filter(m => kindOf(m) === S.kind).sort((a, b) => b.t - a.t);
  await Promise.all(list.map(m => getInfo(m).then(() => getRT(m))));
  if (my === gen) render(list, list.length ? '' : empty);
}

async function search(q) {
  status('Searching…'); const my = ++gen;
  const r = await tmdb('/search/multi', {query: q, region: 'NL'});
  const all = r.results.filter(x => ['movie', 'tv'].includes(x.media_type) && x.poster_path).map(x => norm(x, x.media_type));
  const list = all.filter(m => kindOf(m) === S.kind).slice(0, 20), other = all.length - list.length;
  await Promise.all(list.map(m => getInfo(m).then(() => getRT(m))));
  if (my === gen) render(list, list.length ? 'Rate what you have seen — it trains your picks.'
    : other ? `Nothing in ${KINDS[S.kind]}, but ${other} result(s) in another type — switch at the top.` : 'Nothing found.');
}

const year = m => (m.release_date || '').slice(0, 4);
function meta(m) {
  const i = info[key(m)] || {}, rt = 'https://www.rottentomatoes.com/search?search=' + encodeURIComponent(m.title);
  const len = m.mt === 'tv'
    ? (i.seasons ? ` · ${i.seasons} season${i.seasons > 1 ? 's' : ''}` : '') + (i.runtime ? ` · ${i.runtime}m/ep` : '')
    : i.runtime ? ` · ${fmt(i.runtime)}` : '';
  return `${year(m)} · ★ ${(m.vote_average || 0).toFixed(1)}${RT[key(m)] ? ` · <a href="${rt}" target="_blank" rel="noopener">🍅 ${RT[key(m)]}%</a>` : ''}${len}`
    + (m.match ? ` · <span class="match">${m.match}% match</span>` : '');
}
const genreNames = m => (m.genre_ids || []).slice(0, 3).map(x => genres[m.mt]?.[x]).filter(Boolean).join(', ');
function logos(m) {
  const w = info[key(m)] || {list: []};
  return w.list.map(p => `<a href="${esc(w.link)}" target="_blank" rel="noopener" title="${esc(p.provider_name)}"><img src="${IMG}w92${p.logo_path}" alt="${esc(p.provider_name)}"></a>`).join('')
    || '<span class="mute">Not on your services</span>';
}
function links(m) {
  // ponytail: RT search page, not the exact title page (OMDb doesn't give RT links); first result is nearly always it
  const q = encodeURIComponent(m.title), yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${m.title} ${year(m)} trailer`);
  return `<a href="${yt}" target="_blank" rel="noopener">▶ Trailer</a> · <a href="https://www.rottentomatoes.com/search?search=${q}" target="_blank" rel="noopener">🍅 Reviews</a>`;
}

function card(m) {
  const k = key(m), r = view('ratings')[k]?.r, w = view('watch')[k], x = view('nope')[k];
  const b = (a, on, label, icon) => `<button data-a="${a}" class="${on ? 'on' : ''}" title="${label}" aria-label="${label}">${icon}</button>`;
  return `<article class="card" data-key="${k}">
    <img class="poster" loading="lazy" src="${IMG}w342${m.poster_path}" alt="${esc(m.title)} poster">
    <div class="info">
      <b>${esc(m.title)}</b>
      <span class="mute">${meta(m)}</span>
      <span class="mute">${genreNames(m)}</span>
      <div class="prov">${logos(m)}</div>
      <details><summary>About</summary>${esc(m.overview)} ${links(m)}</details>
      <div class="acts">
        ${b(2, r === 2, 'Favourite – would watch again', '❤️')}${b(1, r === 1, 'Seen it – good', '👍')}${b(0, r === 0, 'Seen it – ok', '😐')}${b(-1, r === -1, 'Seen it – bad', '👎')}${b('w', w, w ? 'On watchlist' : 'Add to watchlist', w ? '✓' : '＋')}${b('x', x, 'Not interested', '🚫')}
      </div>
    </div></article>`;
}

function render(list, msg = '') {
  shown = new Map(list.map(m => [key(m), m]));
  $('#grid').innerHTML = list.map(card).join('');
  status(msg);
}
const status = msg => $('#status').textContent = msg;

function act(m, a) {
  const k = key(m);
  const slim = {id: m.id, mt: m.mt, title: m.title, poster_path: m.poster_path, genre_ids: m.genre_ids || m.genres?.map(g => g.id) || [],
    original_language: m.original_language, vote_average: m.vote_average, release_date: m.release_date, overview: m.overview, t: Date.now()};
  const on = a === 'w' ? !!view('watch')[k] : a === 'x' ? !!view('nope')[k] : view('ratings')[k]?.r === +a; // tapping a lit button undoes it
  for (const n of who()) {
    const u = S.users[n];
    if (a === 'w') on ? delete u.watch[k] : (u.watch[k] = slim);
    else if (a === 'x') on ? delete u.nope[k] : (u.nope[k] = slim, delete u.ratings[k], delete u.watch[k]);
    else if (on) delete u.ratings[k];
    else { u.ratings[k] = {...slim, r: +a}; delete u.watch[k]; delete u.nope[k] }
  }
  save();
}

// --- Tonight: one title at a time; every "no + why" reshapes the rest of the session ---
const REASONS = [
  ['🎭 Not this genre', (m, T) => (m.genre_ids || []).forEach(g => T.g[g] = (T.g[g] || 0) - 2)],
  ['⏱ Too long', (m, T) => { const r = info[key(m)]?.runtime; if (r) T.maxRun = Math.min(T.maxRun, r - 10) }],
  ['📅 Too old', (m, T) => T.minYear = Math.max(T.minYear, +year(m) + 1)],
  ['🌑 Too heavy', (m, T) => HEAVY.forEach(g => T.g[g] = (T.g[g] || 0) - 1.5)],
  ['🎈 Too light', (m, T) => LIGHT.forEach(g => T.g[g] = (T.g[g] || 0) - 1.5)],
  ['★ Not good enough', (m, T) => T.minScore = Math.max(T.minScore, (m.vote_average || 0) + 0.3)],
  ['💬 No subtitles', (m, T) => T.subs = false],
  ['👀 Seen it', m => act(m, '0')],
  ['🤷 Just not this one', (m, T) => (m.genre_ids || []).forEach(g => T.g[g] = (T.g[g] || 0) - 0.5)],
];
const tCheap = m => !T.done.has(key(m)) && !rated(m) && fits(m) && (m.vote_average || 0) >= T.minScore
  && +year(m) >= T.minYear && (T.subs || ['en', 'nl'].includes(m.original_language));
const tFull = m => onMyServices(m) && runOK(m, T.maxRun) && (!S.f.minRT || !S.omdb || RT[key(m)] >= S.f.minRT);
const tScore = m => score(m, T.P) + (m.genre_ids || []).reduce((a, g) => a + (T.g[g] || 0), 0);

async function tonightStart() {
  T = {P: profile(), g: {}, maxRun: maxRun(), minYear: 0, minScore: S.f.minScore || 0, subs: true,
    nos: 0, pages: {}, pool: [], ids: new Set(), done: new Set(), cur: null, mode: 'pick'};
  tonightRender('Finding one…');
  await tonightFill();
  tonightNext();
}
async function tonightFill() {
  const w = want(), banned = Object.keys(T.g).filter(g => T.g[g] <= -2); // a genre turned down twice is out for the night
  let fetched = 0;
  for (const mt of types()) {
    const base = discoverBase(mt, {...w, not: [w.not, ...banned].filter(Boolean).join('|')}, T.maxRun, T.minScore);
    if (T.minYear) base[mt === 'tv' ? 'first_air_date.gte' : 'primary_release_date.gte'] = T.minYear + '-01-01';
    const qk = mt + JSON.stringify(base), p = T.pages[qk] = (T.pages[qk] || 0) + 1; // next page of this exact query
    for (const r of await Promise.allSettled([
      discover(mt, {...base, sort_by: 'popularity.desc', page: p}),
      discover(mt, {...base, sort_by: 'vote_average.desc', 'vote_count.gte': minVotes(mt) * 10, page: p})]))
      if (r.status === 'fulfilled') for (const m of (fetched += r.value.length, r.value))
        if (!T.ids.has(key(m)) && m.poster_path && m.vote_count >= minVotes(mt)) { T.ids.add(key(m)); T.pool.push(m) }
  }
  return fetched; // 0 = TMDB has nothing more for these rules (all-duplicate pages still count, so we keep paging)
}
async function tonightNext() {
  const my = T; T.mode = 'pick'; T.cur = null; tonightRender('Finding the next one…');
  for (let n = 0; n < 15; n++) {
    const ranked = T.pool.filter(tCheap).sort((a, b) => tScore(b) - tScore(a));
    for (const m of ranked.slice(0, 8)) {
      await getInfo(m); if (S.f.minRT) await getRT(m);
      if (my !== T) return; // session restarted meanwhile
      if (tFull(m)) { await getRT(m); T.cur = m; ranked.slice(1, 4).forEach(getInfo); return tonightRender() }
      T.done.add(key(m));
    }
    if (ranked.length < 15 && !(await tonightFill())) break;
  }
  if (my === T) tonightRender('Ran out of matches — loosen the type/mood/filters at the top, or tap 🌙 Tonight to start over.');
}
function tonightRender(msg) {
  const learned = Object.entries(T.g).filter(([, v]) => v <= -1.5).map(([g]) => 'less ' + (genres.movie[g] || genres.tv[g] || g).toLowerCase());
  if (T.maxRun < maxRun()) learned.push('under ' + fmt(T.maxRun));
  if (T.minYear) learned.push(`from ${T.minYear}`);
  if (T.minScore > (S.f.minScore || 0)) learned.push(`★ ${T.minScore.toFixed(1)}+`);
  if (!T.subs) learned.push('English/Dutch only');
  $('#tlearn').textContent = !T.nos ? 'Swipe ← not tonight · → watch this (or the buttons / arrow keys). Say why — after 10–15 it knows what you want.'
    : `No #${T.nos}` + (learned.length ? ' · learned: ' + learned.join(' · ') : '');
  const m = T.cur, b = $('#tbtns');
  if (!m) { $('#tcard').innerHTML = `<p class="mute" style="padding:24px">${esc(msg)}</p>`; b.innerHTML = ''; return }
  $('#tcard').innerHTML = `<img class="poster" src="${IMG}w500${m.poster_path}" alt="${esc(m.title)} poster" draggable="false">
    <div class="info">${T.mode === 'win' ? '<b class="match">🍿 Tonight’s pick</b>' : ''}
      <b style="font-size:19px">${esc(m.title)}</b><span class="mute">${meta(m)}</span><span class="mute">${genreNames(m)}</span>
      <div class="prov">${logos(m)}</div><p class="mute clamp">${esc(m.overview)}</p><span class="mute">${links(m)}</span></div>`;
  b.className = 'row' + (T.mode === 'pick' ? ' big' : '');
  b.innerHTML = T.mode === 'pick' ? '<button data-t="no">✕ Not tonight</button><button data-t="yes">♥ Watch this</button>'
    : T.mode === 'why' ? '<span class="mute" style="width:100%;text-align:center">Why not?</span>'
      + REASONS.map(([t], i) => `<button data-t="why" data-r="${i}">${t}</button>`).join('') + '<button data-t="why" data-r="-1">Skip</button>'
    : `<a class="btn" href="${esc(info[key(m)]?.link)}" target="_blank" rel="noopener">▶ Where to watch</a>
       <button data-t="list">${view('watch')[key(m)] ? '✓ On list' : '+ List'}</button><button data-t="more">↺ Keep looking</button>`;
}
function tonightAct(t, r) {
  const m = T?.cur; if (!m) return;
  if (t === 'no') T.mode = 'why';
  else if (t === 'yes') T.mode = 'win';
  else if (t === 'why') { if (r >= 0) REASONS[r][1](m, T); T.done.add(key(m)); T.nos++; return tonightNext() }
  else if (t === 'list') act(m, 'w');
  else if (t === 'more') { (m.genre_ids || []).forEach(g => T.g[g] = (T.g[g] || 0) + 0.5); T.done.add(key(m)); return tonightNext() }
  tonightRender();
}

async function show() {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const tonight = tab === 'tonight';
  $('#filters').hidden = !['foryou', 'tonight'].includes(tab);
  $('#genres').hidden = $('#filters').hidden || S.kind === 'doc';
  $('#surprise').hidden = $('#regen').hidden = tab !== 'foryou';
  $('#grid').hidden = $('#status').hidden = tonight; $('#tonight').hidden = !tonight;
  const what = KINDS[S.kind].slice(3).toLowerCase();
  try {
    if (tonight) await tonightStart();
    else if (tab === 'foryou') await forYou();
    else if (tab === 'watch') await listTab(view('watch'), `No ${what} saved yet — hit ＋ on anything.`);
    else if (tab === 'seen') await listTab({...view('ratings'), ...view('nope')}, `No ${what} rated or hidden yet.`);
  } catch (e) { status('Could not reach TMDB: ' + e.message) }
}

const restart = () => { round = 0; past.clear() };
function chrome() {
  $('#who').value = S.who;
  $('#kinds').innerHTML = Object.entries(KINDS).map(([k, t]) => `<button data-kind="${k}" class="${S.kind === k ? 'on' : ''}">${t}</button>`).join('')
    + '<span class="sep">│</span>' + Object.keys(SERVICES).map(s => `<button data-svc="${s}" class="${S.off.includes(s) ? '' : 'on'}">${s}</button>`).join('');
  const sel = (k, label, opts) => `<select data-f="${k}" aria-label="${label}">` +
    opts.map(([v, t]) => `<option value="${v}" ${S.f[k] == v ? 'selected' : ''}>${t}</option>`).join('') + '</select>';
  $('#filters').innerHTML =
    sel('minScore', 'Minimum TMDB rating', [[0, '★ any'], [6, '★ 6+'], [6.5, '★ 6.5+'], [7, '★ 7+'], [7.5, '★ 7.5+'], [8, '★ 8+']]) +
    (S.omdb ? sel('minRT', 'Minimum Rotten Tomatoes', [[0, '🍅 any'], [60, '🍅 60%+'], [70, '🍅 70%+'], [80, '🍅 80%+'], [90, '🍅 90%+']]) : '') +
    sel('maxRun', 'Maximum length', [[0, '⏱ any length'], [90, '⏱ ≤ 1h30'], [105, '⏱ ≤ 1h45'], [120, '⏱ ≤ 2h'], [150, '⏱ ≤ 2h30']]);
  const chip = (k, t) => `<button data-g="${esc(k)}" class="${pick === k ? 'on' : ''}">${esc(t)}</button>`;
  const mt = S.kind === 'tv' ? 'tv' : 'movie';
  $('#genres').innerHTML = chip('', 'Anything') + Object.keys(MOODS).filter(k => mt === 'movie' || MOODS[k].tv).map(k => chip(k, k)).join('')
    + '<span class="sep">│</span>' + Object.entries(genres[mt]).filter(([id]) => ![99, 10767, 10763].includes(+id)).map(([id, n]) => chip('g' + id, n)).join('');
}

// --- events ---
$('#grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const el = b.closest('.card'), k = el.dataset.key, m = shown.get(k) || stored(view('ratings')[k] || view('watch')[k] || view('nope')[k]);
  act(m, b.dataset.a);
  const gone = (tab === 'foryou' && rated(m)) || (tab === 'watch' && !view('watch')[k]) || (tab === 'seen' && !rated(m));
  if (gone) { el.style.opacity = 0; setTimeout(() => el.remove(), 300) }
  else el.outerHTML = card(m);
});
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; show() });
$('#who').onchange = e => { S.who = e.target.value; save(); restart(); lastCount = null; show() };
$('#kinds').onclick = e => {
  const {kind, svc} = e.target.dataset;
  if (kind) { S.kind = kind; pick = '' }
  else if (svc) S.off = S.off.includes(svc) ? S.off.filter(x => x !== svc) : [...S.off, svc];
  else return;
  save(); restart(); chrome(); show();
};
$('#filters').onchange = e => { S.f[e.target.dataset.f] = +e.target.value; save(); restart(); show() };
$('#genres').onclick = e => {
  if (e.target.dataset.g === undefined) return;
  pick = e.target.dataset.g; restart(); chrome(); show();
};
$('#search').onsubmit = e => {
  e.preventDefault(); const q = $('#q').value.trim(); if (!q) return;
  tab = 'search'; show(); search(q).catch(err => status(err.message));
};
$('#regen').onclick = async e => {
  const b = e.target; b.disabled = true; b.textContent = '⏳ Finding…';
  try { await forYou(true) } catch (err) { status('Could not reach TMDB: ' + err.message) }
  b.disabled = false; b.textContent = '🔄 New picks';
  window.scrollTo({top: 0, behavior: 'smooth'});
};
$('#surprise').onclick = () => {
  const cards = [...document.querySelectorAll('.card')].slice(0, 8); if (!cards.length) return;
  const c = cards[Math.floor(Math.random() * cards.length)];
  document.querySelectorAll('.flash').forEach(x => x.classList.remove('flash'));
  c.classList.add('flash'); c.scrollIntoView({behavior: 'smooth', block: 'center'});
};
$('#tbtns').onclick = e => { const b = e.target.closest('button[data-t]'); if (b) tonightAct(b.dataset.t, +b.dataset.r) };
// swipe: drag the card left (not tonight) or right (watch this)
let sx = null;
const tc = $('#tcard');
tc.onpointerdown = e => { if (T?.mode === 'pick' && T.cur && !e.target.closest('a')) { sx = e.clientX; tc.classList.add('drag') } };
tc.onpointermove = e => { if (sx !== null) tc.style.transform = `translateX(${e.clientX - sx}px) rotate(${(e.clientX - sx) / 25}deg)` };
tc.onpointerup = tc.onpointercancel = tc.onpointerleave = e => {
  if (sx === null) return;
  const dx = e.clientX - sx; sx = null; tc.classList.remove('drag'); tc.style.transform = '';
  if (dx < -80) tonightAct('no'); else if (dx > 80) tonightAct('yes');
};
document.addEventListener('keydown', e => {
  if (tab !== 'tonight' || T?.mode !== 'pick' || e.target.matches?.('input,textarea,select')) return;
  if (e.key === 'ArrowLeft') tonightAct('no'); else if (e.key === 'ArrowRight') tonightAct('yes');
});
$('#gear').onclick = () => $('#settings').hidden = !$('#settings').hidden;
$('#keyform').onsubmit = e => { e.preventDefault(); S.key = $('#key').value.trim(); save(); init() };
$('#omdbform').onsubmit = e => { e.preventDefault(); S.omdb = $('#omdb').value.trim(); save(); chrome(); show() };
$('#copy').onclick = () => {
  $('#sync').value = JSON.stringify({users: S.users, off: S.off});
  navigator.clipboard?.writeText($('#sync').value); status('Copied — paste it into Settings on your other device.');
};
$('#load').onclick = () => {
  try {
    const d = JSON.parse($('#sync').value);
    if (d.users) S.users = d.users;
    else if (d.ratings) S.users[S.who === 'both' ? 'Harry' : S.who] = {...blank(), ...d}; // export from before profiles
    else throw 0;
    if (d.off) S.off = d.off;
    save(); status('Loaded.'); show();
  } catch { status('That text is not a valid export.') }
};

async function init() {
  $('#key').value = S.key; $('#omdb').value = S.omdb;
  if (!S.key) { $('#settings').hidden = false; return status('Add a free TMDB key to start (⚙︎ Settings).') }
  try {
    const [gm, gt, pm, pt] = await Promise.all([tmdb('/genre/movie/list'), tmdb('/genre/tv/list'),
      tmdb('/watch/providers/movie', {watch_region: 'NL'}), tmdb('/watch/providers/tv', {watch_region: 'NL'})]);
    gm.genres.forEach(x => genres.movie[x.id] = x.name);
    gt.genres.forEach(x => genres.tv[x.id] = x.name);
    myProv = [...pm.results, ...pt.results].filter((x, i, a) => serviceOf(x.provider_name) && a.findIndex(y => y.provider_id === x.provider_id) === i);
  } catch (e) { $('#settings').hidden = false; return status('That key did not work (' + e.message + ').') }
  $('#settings').hidden = true;
  chrome(); show();
}
init();
</script>
</body>
</html>
